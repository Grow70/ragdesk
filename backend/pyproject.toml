[project]
name = "ragdesk-backend"
version = "0.1.0"
description = "Enterprise knowledge base RAG demo backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jieba==0.42.1",
    "jsonschema>=4.26,<5",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.10,<3",
    "pypdf>=6.19,<7",
    "python-multipart>=0.0.32,<1",
    "rank-bm25==0.2.2",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
